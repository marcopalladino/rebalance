<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebalance Experience — Business Cards (Abono)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    /* ===== Reset ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --teal: #1a8c7e;
      --teal-dark: #0e6b5f;
      --teal-light: #e8f5f3;
      --gold: #e8a830;
      --gold-light: #f5c85c;
      --coral: #c94a3a;
      --cream: #fdf8f2;
      --warm-gray: #6b5e54;
      --dark: #1e1e1e;
      --card-w: 85mm;
      --card-h: 55mm;
    }

    @page {
      size: A4 portrait;
      margin: 8mm;
    }

    html {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #e0dcd6;
      color: var(--dark);
    }

    /* ===== Page Header (screen only) ===== */
    .page-header {
      text-align: center;
      padding: 24px 20px 12px;
      color: var(--warm-gray);
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22pt;
      color: var(--teal-dark);
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 10pt;
      color: #9a8e84;
    }

    /* ===== Print Sheet ===== */
    .print-sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 12px auto;
      background: white;
      padding: 10mm;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }

    .sheet-label {
      text-align: center;
      font-size: 9pt;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--teal);
      margin-bottom: 6mm;
      padding-bottom: 3mm;
      border-bottom: 1px dashed rgba(26, 140, 126, 0.25);
    }

    /* ===== Card Grid ===== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, var(--card-w));
      gap: 5mm;
      justify-content: center;
    }

    /* ===== Base Card ===== */
    .card {
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 3mm;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 0.3mm rgba(0,0,0,0.08);
    }

    /* ============================================
       FRONT SIDE
       ============================================ */
    .card-front {
      background: linear-gradient(160deg, var(--cream) 0%, #fff8f0 50%, #f3ede5 100%);
    }

    /* Decorative sun glow top-right */
    .card-front::before {
      content: '';
      position: absolute;
      top: -12mm;
      right: -8mm;
      width: 30mm;
      height: 30mm;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232, 168, 48, 0.15) 0%, transparent 70%);
    }

    /* Wave accent bottom */
    .card-front::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 5mm;
      background: linear-gradient(90deg, var(--teal), var(--gold));
      opacity: 0.12;
    }

    .front-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 3mm 4mm 5mm;
      text-align: center;
    }

    .front-logo {
      width: 26mm;
      height: auto;
      margin-bottom: 2mm;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.06));
    }

    .front-divider {
      width: 18mm;
      height: 0.5mm;
      background: linear-gradient(90deg, transparent, var(--gold), var(--teal), var(--gold), transparent);
      margin-bottom: 2mm;
      border-radius: 0.25mm;
    }

    .front-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 6.5pt;
      color: var(--teal-dark);
      line-height: 1.3;
      margin-bottom: 1.2mm;
    }

    .front-title span {
      color: var(--coral);
    }

    .front-subtitle {
      font-size: 5pt;
      font-weight: 400;
      color: var(--warm-gray);
      line-height: 1.35;
      font-style: italic;
    }

    /* ===== Accent line at bottom ===== */
    .front-accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1.2mm;
      background: linear-gradient(90deg, var(--teal), var(--gold), var(--coral));
      z-index: 2;
    }

    /* ============================================
       BACK SIDE
       ============================================ */
    .card-back {
      background: linear-gradient(160deg, #faf7f2 0%, var(--cream) 60%, #f0ece6 100%);
    }

    .card-back::before {
      content: '';
      position: absolute;
      bottom: -8mm;
      left: -6mm;
      width: 24mm;
      height: 24mm;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26, 140, 126, 0.08) 0%, transparent 70%);
    }

    .back-content {
      position: relative;
      z-index: 1;
      display: flex;
      height: 100%;
      padding: 3.5mm 4mm;
    }

    /* Left column: QR */
    .back-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 28mm;
      flex-shrink: 0;
      padding-right: 3mm;
      border-right: 0.3mm solid rgba(26, 140, 126, 0.12);
    }

    .back-qr-frame {
      width: 20mm;
      height: 20mm;
      background: white;
      border-radius: 2mm;
      padding: 1.5mm;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 0.4mm solid rgba(26, 140, 126, 0.12);
      margin-bottom: 1.5mm;
    }

    .back-qr-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .back-free-label {
      font-size: 4.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: white;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      padding: 0.8mm 3mm;
      border-radius: 1mm;
      text-align: center;
      line-height: 1;
      box-shadow: 0 1px 3px rgba(26, 140, 126, 0.2);
    }

    /* Right column: contact info */
    .back-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 3.5mm;
      flex: 1;
      gap: 2mm;
    }

    .back-brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 6.5pt;
      color: var(--teal-dark);
      margin-bottom: 0.5mm;
    }

    .back-services {
      font-size: 4.5pt;
      color: var(--warm-gray);
      line-height: 1.4;
    }

    .back-services strong {
      color: var(--dark);
      font-weight: 600;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1.5mm;
    }

    .contact-icon-small {
      width: 4mm;
      height: 4mm;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5.5pt;
      flex-shrink: 0;
    }

    .contact-icon-small.web {
      background: linear-gradient(135deg, var(--teal), #28a495);
      color: white;
    }

    .contact-icon-small.wa {
      background: linear-gradient(135deg, #25d366, #128c4e);
      color: white;
    }

    .contact-text {
      font-size: 5pt;
      color: var(--teal-dark);
      font-weight: 500;
      text-decoration: none;
      line-height: 1;
    }

    .contact-text.number {
      font-weight: 600;
      font-size: 5.5pt;
      letter-spacing: 0.02em;
    }

    /* Back accent line */
    .back-accent-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1.2mm;
      background: linear-gradient(90deg, var(--teal), var(--gold), var(--coral));
      z-index: 2;
    }

    /* ===== Cut Guides (screen only) ===== */
    .cut-guide {
      text-align: center;
      font-size: 7pt;
      color: #bbb;
      margin-top: 4mm;
      font-style: italic;
    }

    /* ===== Print Styles ===== */
    @media print {
      body {
        background: white;
      }

      .page-header {
        display: none;
      }

      .print-sheet {
        box-shadow: none;
        margin: 0;
        padding: 8mm;
        page-break-after: always;
      }

      .cut-guide {
        color: #ddd;
      }
    }

    /* ===== Screen Preview ===== */
    @media screen {
      .print-sheet {
        border-radius: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- Screen header -->
  <div class="page-header">
    <h1>Biglietti da Visita — Business Cards (Abono)</h1>
    <p>85 × 55 mm · Premi Ctrl+P per stampare · Press Ctrl+P to print</p>
  </div>

  <!-- ==========================================
       PAGE 1: FRONT SIDES (10 cards)
       ========================================== -->
  <div class="print-sheet">
    <div class="sheet-label">✂ Fronte · Front Side</div>
    <div class="card-grid" id="frontGrid"></div>
    <p class="cut-guide">✂ Tagliare lungo i bordi · Cut along edges</p>
  </div>

  <!-- ==========================================
       PAGE 2: BACK SIDES (10 cards)
       ========================================== -->
  <div class="print-sheet">
    <div class="sheet-label">✂ Retro · Back Side</div>
    <div class="card-grid" id="backGrid"></div>
    <p class="cut-guide">✂ Tagliare lungo i bordi · Cut along edges</p>
  </div>

  <!-- ===== Card Templates (used by JS to clone) ===== -->
  <template id="frontTemplate">
    <div class="card card-front">
      <div class="front-content">
        <img class="front-logo" src="assets/logo.png" alt="Rebalance Experience">
        <div class="front-divider"></div>
        <p class="front-title">
          Gimnasia Postural de Grupo<br>
          &amp; <span>Personal Training</span>
        </p>
        <p class="front-subtitle">
          Group Postural Gymnastics &amp; Personal Training
        </p>
      </div>
      <div class="front-accent-line"></div>
    </div>
  </template>

  <template id="backTemplate">
    <div class="card card-back">
      <div class="back-accent-line"></div>
      <div class="back-content">
        <div class="back-left">
          <div class="back-qr-frame">
            <img src="qrcodes/ticket_rebalance_sub.png" alt="QR Code">
          </div>
          <div class="back-free-label">ABONO</div>
        </div>
        <div class="back-right">
          <div class="back-brand">Rebalance<br>Experience</div>
          <div class="back-services">
            <strong>🧘 Gimnasia Postural</strong><br>
            <strong>💪 Personal Training</strong>
          </div>
          <div class="contact-item">
            <div class="contact-icon-small web">🌐</div>
            <span class="contact-text">www.rebalance-experience.fun</span>
          </div>
          <div class="contact-item">
            <div class="contact-icon-small wa">💬</div>
            <span class="contact-text number">+34 642 468 566</span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script>
    // Clone 10 front cards and 10 back cards into the grids
    const frontGrid = document.getElementById('frontGrid');
    const backGrid = document.getElementById('backGrid');
    const frontTpl = document.getElementById('frontTemplate');
    const backTpl = document.getElementById('backTemplate');

    for (let i = 0; i < 10; i++) {
      frontGrid.appendChild(frontTpl.content.cloneNode(true));
      backGrid.appendChild(backTpl.content.cloneNode(true));
    }
  </script>

</body>
</html>
